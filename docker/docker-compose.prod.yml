# Docker Compose for Loan Default Prediction API
# Production-ready deployment with monitoring and validation

version: '3.8'

services:
  # Main API Service
  loan-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: production
    container_name: loan-default-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - PYTHONPATH=/app/src
      - MODEL_PATH=/app/models
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      # Mount trained models (bind mount for easy updates)
      - ../src/models/saved_models:/app/models/saved_models:ro
      - ../src/models/test_results:/app/models/test_results:ro
      # Mount loan data
      - ../loan_data:/app/loan_data:ro
      # Mount logs for monitoring
      - loan-api-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - loan-api-network
    depends_on:
      - redis
      - prometheus

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: loan-api-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - loan-api-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-defaultpassword}

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: loan-api-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - loan-api-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana for monitoring dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: loan-api-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    restart: unless-stopped
    networks:
      - loan-api-network
    depends_on:
      - prometheus

  # Nginx reverse proxy and load balancer
  nginx:
    image: nginx:alpine
    container_name: loan-api-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    restart: unless-stopped
    networks:
      - loan-api-network
    depends_on:
      - loan-api

  # Model validation service
  model-validator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.validator
    container_name: loan-model-validator
    environment:
      - PYTHONPATH=/app/src
      - MODEL_PATH=/app/models
      - API_URL=http://loan-api:8000
      - VALIDATION_SCHEDULE=${VALIDATION_SCHEDULE:-0 */6 * * *}  # Every 6 hours
    volumes:
      - ../src/models:/app/models:ro
      - ../loan_data:/app/loan_data:ro
      - validation-reports:/app/reports
    restart: unless-stopped
    networks:
      - loan-api-network
    depends_on:
      - loan-api

# Persistent volumes
volumes:
  loan-api-logs:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  nginx-logs:
    driver: local
  validation-reports:
    driver: local

# Network configuration
networks:
  loan-api-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16