version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: numerics-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_KEY=${API_KEY:-dev-api-key-123}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - MODEL_ID=${MODEL_ID:-openai/gpt-4.1-mini}
      - DATA_PATH=/app/data
      - MODELS_PATH=/app/models
      - RESULTS_PATH=/app/results
      - LOGS_PATH=/app/logs
    volumes:
      - backend_data:/app/data
      - backend_models:/app/models
      - backend_results:/app/results
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    networks:
      - numerics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React Service
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: numerics-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - numerics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Cache (Optional - for session management)
  redis:
    image: redis:7-alpine
    container_name: numerics-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - numerics-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database (Optional - for data persistence)
  database:
    image: postgres:15-alpine
    container_name: numerics-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-numerics_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - numerics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Load Balancer (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: numerics-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-lb.conf:/etc/nginx/nginx.conf
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - numerics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

# Persistent volumes
volumes:
  backend_data:
    driver: local
  backend_models:
    driver: local
  backend_results:
    driver: local
  backend_logs:
    driver: local
  backend_uploads:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  nginx_logs:
    driver: local

# Networks
networks:
  numerics-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16