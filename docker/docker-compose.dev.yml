# Docker Compose for Development
# Simplified setup for local development and testing of Loan Default Prediction API

version: '3.8'

services:
  # Main API Service - Development
  loan-api-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      target: production
    container_name: loan-api-dev
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/src
      - MODEL_PATH=/app/src/models
      - LOG_LEVEL=DEBUG
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      # Mount source code for hot reload
      - ../src:/app/src
      # Mount trained models from the correct src/models directory
      - ../src/models/saved_models:/app/src/models/saved_models
      - ../src/models/test_results:/app/src/models/test_results
      # Mount loan data
      - ../loan_data:/app/loan_data
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - loan-api-dev-network

  # Redis for development
  redis-dev:
    image: redis:7-alpine
    container_name: loan-redis-dev
    ports:
      - "6379:6379"
    restart: "no"
    networks:
      - loan-api-dev-network

networks:
  loan-api-dev-network:
    driver: bridge